name: Update README stats date

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update date in badge URLs
        run: |
          python3 - <<'PY'
          import re, datetime
          today = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d')
          p = 'README.md'
          s = open(p).read()
          s = re.sub(r'install-\d{4}-\d{2}-\d{2}', 'install-' + today, s)
          s = re.sub(r'active-\d{4}-\d{2}-\d{2}', 'active-' + today, s)
          open(p, 'w').write(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update README stats date"
          git push